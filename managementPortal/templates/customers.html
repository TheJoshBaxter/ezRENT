{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <h2>Customers</h2>
    <br>
    {% for customer in customers %}
        <div class="card mb-3">
            <div class="card-body d-flex justify-content-between align-items-center">
                <!-- Customer Information on the left -->
                <div>
                    <h5 class="card-title">{{ customer.first_name }} {{ customer.last_name }}</h5>
                    <p><strong><em>{{ customer.company_name }}</em></strong></p>
                </div>

                <!-- Action Icons on the right -->
                <div>
                    <!-- Edit Button (Triggers Modal) -->
                    <a href="#" class="btn btn-link" data-bs-toggle="modal" data-bs-target="#editCustomerModal-{{ customer.id }}">
                        <i class="fas fa-edit"></i>
                    </a>

                    <!-- Delete Button -->
                    <a href="{% url 'delete_customer' customer.id %}" class="btn btn-link text-danger" onclick="return confirm('Are you sure you want to delete this customer?                  Rental records associated with this customer will also be deleted.');">
                        <i class="fas fa-trash"></i>
                    </a>

                    <!-- Call Button -->
                    <a href="tel:{{ customer.phone_number }}" class="btn btn-link">
                        <i class="fas fa-phone"></i>
                    </a>

                    <!-- Text Button -->
                    <a href="sms:{{ customer.phone_number }}" class="btn btn-link">
                        <i class="fas fa-sms"></i>
                    </a>

                    <!-- Email Button -->
                    <a href="mailto:{{ customer.email }}" class="btn btn-link">
                        <i class="fas fa-envelope"></i>
                    </a>
                </div>
            </div>
        </div>

        <!-- Modal for Editing Customer Information -->
        <div class="modal fade" id="editCustomerModal-{{ customer.id }}" tabindex="-1" aria-labelledby="editCustomerModalLabel-{{ customer.id }}" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="editCustomerModalLabel-{{ customer.id }}">Edit {{ customer.first_name }} {{ customer.last_name }}</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form method="post" action="{% url 'edit_customer' customer.id %}">
                            {% csrf_token %}
                            <!-- First Name -->
                            <div class="mb-3">
                                <label for="firstName-{{ customer.id }}" class="form-label">First Name</label>
                                <input type="text" class="form-control" id="firstName-{{ customer.id }}" name="first_name" value="{{ customer.first_name }}" required>
                            </div>
                            <!-- Last Name -->
                            <div class="mb-3">
                                <label for="lastName-{{ customer.id }}" class="form-label">Last Name</label>
                                <input type="text" class="form-control" id="lastName-{{ customer.id }}" name="last_name" value="{{ customer.last_name }}" required>
                            </div>
                            <!-- Company Name -->
                            <div class="mb-3">
                                <label for="companyName-{{ customer.id }}" class="form-label">Company Name</label>
                                <input type="text" class="form-control" id="companyName-{{ customer.id }}" name="company_name" value="{{ customer.company_name }}">
                            </div>
                            <!-- Phone Number -->
                            <div class="mb-3">
                                <label for="phoneNumber-{{ customer.id }}" class="form-label">Phone Number</label>
                                <input type="tel" class="form-control" id="phoneNumber-{{ customer.id }}" name="phone_number" value="{{ customer.phone_number }}" required>
                            </div>
                            <!-- Email -->
                            <div class="mb-3">
                                <label for="email-{{ customer.id }}" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email-{{ customer.id }}" name="email" value="{{ customer.email }}" required>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                <button type="submit" class="btn btn-primary">Save Changes</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    {% endfor %}
</div>
{% endblock %}
