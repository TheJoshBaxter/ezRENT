{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container">
    <h1 class="mt-5">{{ equipment.name }}</h1>
    <div class="row">
        <div class="col-md-6">
            <img class="card-img-top" src="{% static 'img/forklift.webp' %}" alt="{{ equipment.name }}">
        </div>
        <div class="col-md-6">
            <p><strong>Specifications:</strong> {{ equipment.specs }}</p>
            <p><strong>Cost per day:</strong> ${{ equipment.cost_per_day }}</p>
            <p><strong>Available:</strong> {{ equipment.available_quantity }} units</p>

            <form method="post" action="{% url 'equipment_detail' equipment.id %}">
                {% csrf_token %}
                <div class="form-group">
                    <label for="start_date">Rental Start Date</label>
                    <input type="text" class="form-control" id="start_date" name="start_date" required>
                </div>
                <div class="form-group">
                    <label for="end_date">Rental End Date</label>
                    <input type="text" class="form-control" id="end_date" name="end_date" required>
                </div>

                <!-- Trigger button for modal -->
                <button type="button" class="btn btn-success mt-3" data-bs-toggle="modal" data-bs-target="#rentalModal">
                    Book Your Rental
                </button>

                <!-- Bootstrap Modal -->
                <div class="modal fade" id="rentalModal" tabindex="-1" aria-labelledby="rentalModalLabel" aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="rentalModalLabel">Complete Your Rental</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <div class="form-group">
                                    <label for="first_name">First Name</label>
                                    <input type="text" class="form-control" name="first_name" required>
                                </div>
                                <div class="form-group">
                                    <label for="last_name">Last Name</label>
                                    <input type="text" class="form-control" name="last_name" required>
                                </div>
                                <div class="form-group">
                                    <label for="company_name">Company Name (optional)</label>
                                    <input type="text" class="form-control" name="company_name">
                                </div>
                                <div class="form-group">
                                    <label for="phone_number">Phone Number</label>
                                    <input type="tel" class="form-control" name="phone_number" required>
                                </div>
                                <div class="form-group">
                                    <label for="email">Email Address</label>
                                    <input type="email" class="form-control" name="email" required>
                                </div>
                                <div class="form-group">
                                    <label for="pickup_time">Pick-up Time</label>
                                    <input type="time" class="form-control" name="pickup_time" required>
                                </div>
                                <div class="form-group">
                                    <label for="dropoff_time">Drop-off Time</label>
                                    <input type="time" class="form-control" name="dropoff_time" required>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                <button type="submit" class="btn btn-primary">Confirm and Pay</button>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script type="text/javascript">
    $(document).ready(function() {
        var equipmentId = {{ equipment.id }};  // Assuming you pass the equipment ID to the template

        // Fetch unavailable dates from the server
        $.ajax({
            url: "{% url 'get_unavailable_dates' equipment.id %}",  // Django URL for fetching unavailable dates
            method: "GET",
            success: function(response) {
                var unavailableDates = response.unavailable_dates;

                // Convert unavailable dates to an array of string format 'YYYY-MM-DD'
                var disabledDates = unavailableDates.map(function(dateStr) {
                    var date = new Date(dateStr);
                    var day = ("0" + date.getDate()).slice(-2);
                    var month = ("0" + (date.getMonth() + 1)).slice(-2);
                    return date.getFullYear() + '-' + month + '-' + day;
                });
                console.log('Disabled dates:', disabledDates);  // Log disabled dates


                // Initialize jQuery UI Datepicker and disable unavailable dates
                $("#start_date, #end_date").datepicker({
                    dateFormat: "yy-mm-dd",  // Format as 'YYYY-MM-DD'
                    beforeShowDay: function(date) {
                        var dateString = $.datepicker.formatDate('yy-mm-dd', date);
                        console.log('Date being checked:', dateString);  // Log the date being checked by the calendar
                        return [disabledDates.indexOf(dateString) == -1];  // Return true if the date is not disabled
                    }
                });


            }
        });
    });
</script>
{% endblock %}
