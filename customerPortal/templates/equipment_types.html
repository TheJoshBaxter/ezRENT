{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container">
    <h1 class="mt-5">Choose Equipment Type</h1>
    <div class="row">
        {% for item in allEquipmentTypes %}
            <div class="col-md-4">
                <div class="card mb-4">
                    <img class="card-img-top" src="{% static item.imgURL }} %}" alt="{{ item.name }}">
                    <div class="card-body">
                        <h5 class="card-title">{{ item.name }} {{ item.category }}</h5>
                        <p>{{ item.specs|truncatechars:100 }}</p>
                        <p><strong>Quantity:</strong> {{ item.available_quantity }}</p>
                        <a href="{% url 'equipment_list' item.id %}" class="btn btn-primary">View Availability</a>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
